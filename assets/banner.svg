<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="chartGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".3"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".8"/><stop offset="100%" stop-color="#0369a1" stop-opacity=".6"/></linearGradient><linearGradient id="pillGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#4f46e5" stop-opacity=".8"/><stop offset="100%" stop-color="#4338ca" stop-opacity=".6"/></linearGradient><linearGradient id="pillGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#9333ea" stop-opacity=".8"/><stop offset="100%" stop-color="#7e22ce" stop-opacity=".6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.03)}}@keyframes floatSlow1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatSlow2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes waveFlow{0%{transform:translateX(0)}}.title-text{font-weight:800;font-size:38px;fill:#f8fafc;letter-spacing:-.5px}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:16px;fill:#94a3b8;letter-spacing:.2px}.badge-text{font-weight:600;font-size:13px;fill:#fff}.grid-line{stroke:#1e293b;stroke-width:1;stroke-dasharray:4 4}.floating-pill-1{animation:floatSlow1 6s ease-in-out infinite}.floating-pill-2{animation:floatSlow2 7s ease-in-out infinite}.pulse-circle{animation:pulseGlow 4s ease-in-out infinite;transform-origin:center}.animated-dash{stroke-dasharray:6 6;animation:dashAnim 8s linear infinite}</style></defs><rect width="1200" height="340" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="340" fill="none" stroke="#334155" stroke-width="1.5" rx="16"/><g opacity=".4"><path d="M 0,60 L 1200,60" class="grid-line"/><path d="M 0,120 L 1200,120" class="grid-line"/><path d="M 0,180 L 1200,180" class="grid-line"/><path d="M 0,240 L 1200,240" class="grid-line"/><path d="M 0,300 L 1200,300" class="grid-line"/><path d="M 200,0 L 200,340" class="grid-line"/><path d="M 400,0 L 400,340" class="grid-line"/><path d="M 600,0 L 600,340" class="grid-line"/><path d="M 800,0 L 800,340" class="grid-line"/><path d="M 1000,0 L 1000,340" class="grid-line"/></g><g class="pulse-circle" opacity=".35"><circle cx="1020" cy="120" r="140" fill="#38bdf8" filter="url(#glow)" opacity=".15"/><circle cx="180" cy="220" r="160" fill="#a855f7" filter="url(#glow)" opacity=".12"/></g><g opacity=".6"><path fill="url(#chartGrad)" d="M 720,270 Q 820,180 920,230 T 1120,130 L 1200,160 L 1200,340 L 720,340 Z"/><path fill="none" stroke="#38bdf8" stroke-width="2.5" d="M 700,275 Q 820,175 920,225 T 1120,125 L 1200,155" class="animated-dash"/><circle cx="920" cy="225" r="5" fill="#38bdf8" filter="url(#glow)"/><circle cx="1120" cy="125" r="5" fill="#c084fc" filter="url(#glow)"/></g><g class="floating-pill-1"><g transform="translate(60, 260)"><rect width="180" height="38" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" opacity=".9" rx="19"/><circle cx="20" cy="19" r="6" fill="#38bdf8"/><text x="36" y="24" class="badge-text">Dynamic Repricing</text></g><g transform="translate(255, 260)"><rect width="210" height="38" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1.2" opacity=".9" rx="19"/><circle cx="20" cy="19" r="6" fill="#818cf8"/><text x="36" y="24" class="badge-text">Hyper-Localized Elasticity</text></g></g><g class="floating-pill-2"><g transform="translate(480, 260)"><rect width="195" height="38" fill="url(#pillGrad3)" stroke="#c084fc" stroke-width="1.2" opacity=".9" rx="19"/><circle cx="20" cy="19" r="6" fill="#c084fc"/><text x="36" y="24" class="badge-text">Competitive Intel</text></g><g transform="translate(690, 260)"><rect width="195" height="38" fill="#1e293b" stroke="#64748b" stroke-width="1.2" opacity=".9" rx="19"/><circle cx="20" cy="19" r="6" fill="#10b981"/><text x="36" y="24" class="badge-text">Open-Source &amp; SaaS</text></g></g><g transform="translate(60, 52)"><rect width="190" height="26" fill="#1e293b" stroke="#3b82f6" stroke-width="1" rx="6"/><text x="12" y="17.5" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED ECOSYSTEM</text></g><text x="60" y="125" class="title-text">Awesome <tspan fill="url(#primaryGrad)">Hyper-Localized</tspan> Pricing Engines</text><text x="60" y="168" class="subtitle-text">The definitive guide to SaaS platforms &amp; open-source architectures for dynamic pricing,</text><text x="60" y="196" class="subtitle-text">real-time competitor intelligence, multi-regional elasticity modeling, and margin optimization.</text><g opacity=".8"><path fill="#38bdf8" d="M 0 15 Q 15 15 15 0 Q 15 15 30 15 Q 15 15 15 30 Q 15 15 0 15 Z" transform="translate(1080, 50)"/></g><g opacity=".6"><path fill="#c084fc" d="M 0 8 Q 8 8 8 0 Q 8 8 16 8 Q 8 8 8 16 Q 8 8 0 8 Z" transform="translate(1125, 95)"/></g></svg>