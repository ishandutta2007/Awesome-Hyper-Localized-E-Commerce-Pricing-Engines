<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Vibrant Gradient for Primary Highlights -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #ffffff;
      }
      .grid-line {
        stroke: #1e293b;
        stroke-width: 1;
        stroke-dasharray: 4 4;
      }

      /* Animated SVG Elements */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.03); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -100; }
      }
      @keyframes waveFlow {
        0% { transform: translateX(0); }
        100% { transform: translateX(-400px); }
      }

      .floating-pill-1 {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 7s ease-in-out infinite;
      }
      .pulse-circle {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-dash {
        stroke-dasharray: 6 6;
        animation: dashAnim 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Background Animated Wave / Mesh Lines -->
  <g opacity="0.4">
    <path class="grid-line" d="M 0,60 L 1200,60" />
    <path class="grid-line" d="M 0,120 L 1200,120" />
    <path class="grid-line" d="M 0,180 L 1200,180" />
    <path class="grid-line" d="M 0,240 L 1200,240" />
    <path class="grid-line" d="M 0,300 L 1200,300" />
    <path class="grid-line" d="M 200,0 L 200,340" />
    <path class="grid-line" d="M 400,0 L 400,340" />
    <path class="grid-line" d="M 600,0 L 600,340" />
    <path class="grid-line" d="M 800,0 L 800,340" />
    <path class="grid-line" d="M 1000,0 L 1000,340" />
  </g>

  <!-- Glowing Dynamic Waves in Background (Behind Text) -->
  <g opacity="0.35" class="pulse-circle">
    <circle cx="1020" cy="120" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.15" />
    <circle cx="180" cy="220" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.12" />
  </g>

  <!-- Dynamic Pricing Vector Wave Graph (Right Background) -->
  <g opacity="0.6">
    <path d="M 720,270 Q 820,180 920,230 T 1120,130 L 1200,160 L 1200,340 L 720,340 Z" fill="url(#chartGrad)" />
    <path class="animated-dash" d="M 700,275 Q 820,175 920,225 T 1120,125 L 1200,155" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="920" cy="225" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="1120" cy="125" r="5" fill="#c084fc" filter="url(#glow)" />
  </g>

  <!-- Floating Feature Badges (Positioned cleanly below/around without obscuring title) -->
  <g class="floating-pill-1">
    <!-- Dynamic Repricing Pill -->
    <g transform="translate(60, 260)">
      <rect width="180" height="38" rx="19" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="19" r="6" fill="#38bdf8" />
      <text x="36" y="24" class="badge-text">Dynamic Repricing</text>
    </g>
    <!-- Hyper-Localized Engine Pill -->
    <g transform="translate(255, 260)">
      <rect width="210" height="38" rx="19" fill="url(#pillGrad2)" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="19" r="6" fill="#818cf8" />
      <text x="36" y="24" class="badge-text">Hyper-Localized Elasticity</text>
    </g>
  </g>

  <g class="floating-pill-2">
    <!-- Real-time Intelligence Pill -->
    <g transform="translate(480, 260)">
      <rect width="195" height="38" rx="19" fill="url(#pillGrad3)" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="19" r="6" fill="#c084fc" />
      <text x="36" y="24" class="badge-text">Competitive Intel</text>
    </g>
    <!-- Open Source & Enterprise Pill -->
    <g transform="translate(690, 260)">
      <rect width="195" height="38" rx="19" fill="#1e293b" stroke="#64748b" stroke-width="1.2" opacity="0.9" />
      <circle cx="20" cy="19" r="6" fill="#10b981" />
      <text x="36" y="24" class="badge-text">Open-Source &amp; SaaS</text>
    </g>
  </g>

  <!-- FOREGROUND: Header & Title & Subtitle (Guaranteed high-contrast & unobscured) -->
  <!-- Top Category Tag -->
  <g transform="translate(60, 52)">
    <rect width="190" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="12" y="17.5" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" letter-spacing="1">CURATED ECOSYSTEM</text>
  </g>

  <!-- Primary Title -->
  <text x="60" y="125" class="title-text">
    Awesome <tspan fill="url(#primaryGrad)">Hyper-Localized</tspan> Pricing Engines
  </text>

  <!-- Subtitle Line 1 & Line 2 -->
  <text x="60" y="168" class="subtitle-text">
    The definitive guide to SaaS platforms &amp; open-source architectures for dynamic pricing,
  </text>
  <text x="60" y="196" class="subtitle-text">
    real-time competitor intelligence, multi-regional elasticity modeling, and margin optimization.
  </text>

  <!-- Sparkle Accent Icon near title -->
  <g transform="translate(1080, 50)" opacity="0.8">
    <path d="M 0 15 Q 15 15 15 0 Q 15 15 30 15 Q 15 15 15 30 Q 15 15 0 15 Z" fill="#38bdf8" />
  </g>
  <g transform="translate(1125, 95)" opacity="0.6">
    <path d="M 0 8 Q 8 8 8 0 Q 8 8 16 8 Q 8 8 8 16 Q 8 8 0 8 Z" fill="#c084fc" />
  </g>
</svg>
